schema_version = "1.1"

[task]
name = "codimango/android-fragment-viewbinding-lifecycle"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Fix a mini Android FragmentManager that leaks ViewBinding: each fragment has viewModel (survives ROTATE and POP), savedState (survives), and binding (must be cleared on view destruction: HIDE, DETACH, REMOVE, REPLACE). Child fragments must cascade hide/show/max/binding cleanup. Includes BEGIN, ADD, ADD_CHILD, REPLACE, REMOVE, HIDE, SHOW, DETACH, ATTACH, SET_MAX, SAVE, VM_PUT, BIND_PUT, ADD_TO_BACK_STACK, COMMIT, POP (last occurrence, no-op if missing), ROTATE, QUERY. Contract tests check binding cleared vs viewModel retained."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["android", "fragment", "viewbinding", "lifecycle", "kotlin"]


schema_version="1.1"

[task]
name="codimango/android-fingerprint-oil-smear"
description="Android under-display optical fingerprint QA: FPOS container stores brightness map after factory glue leaves oily residue that attenuates light. Goal is to recover true count of pixels covered by oil despite blur smearing from optics, sensor noise, and distant dust particles from assembly. Requires background floor estimation, isolation of dominant oil blob via 8-direction connectivity prioritized by integrated residual mass, exclusion of far dust by mass and distance, peak brightness estimation from top smoothed values, and halo expansion until shell residual falls below noise sigma, then converting integrated residual to count. Different from capacitive ghost-touch CDMR measuring charge, IR void volume OBVL, and coulomb capacity BCTR."
authors=[{name="Tosin Daniel Jimoh", email="purple29th@meta.com"}]
keywords=["android","fingerprint","oil-residue","optical-sensor","light-conservation","flood-fill","dust-rejection"]
format="terminal_bench_single_turn"
workstream="swe_public_repo"


schema_version = "1.1"

[task]
name = "codimango/confocal-gold-subvoxel-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script (no array/imaging/graph libraries) that parses a custom confocal fluorescence volume of a resected tissue labeled with gold nanocluster tumor marker (binary .gvol) and reports true physical tumor volume in mm^3. Microscope Airy pattern plus tissue scattering smears fluorescence beyond anatomical boundary, so voxel counting is unstable across gold load, autofluorescence, and anisotropic pitch. Graded on hidden scans at 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["gold", "fluorescence", "confocal", "nanocluster", "tumor", "psf", "airy", "binary-parsing", "partial-volume", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["gold-nanoparticle", "fluorescence", "confocal", "tumor-volume", "point-spread", "airy-disk", "partial-volume", "confocal-microscopy", "from-scratch", "binary-parsing", "clinical-oncology"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

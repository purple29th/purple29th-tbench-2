schema_version = "1.1"

[task]
name = "codimango/euv-pellicle-carbon-true-mass"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Fab EUV reticle pellicle grows amorphous carbon soot that absorbs 13.5nm light. Custom EPCM 3D map stores fluorescence from carbon. Need total soot mass in micrograms. Pellicle crazing gives long branching carbon veins, airborne fallout gives compact dots to ignore plus window dust specks far away. Simple brightness level counting balloons due to scintillator spread or clips thin veins. Recover hidden volume by median background from whole stack, MAD noise from lower half, 26-connectivity seed 4 sigma, keep crazing veins via bounding box longest at least eight and more than one point six times shortest, discard cubic fallout, core level via 3x3x3 smoothed top four, shell growth to noise floor, mass equals voxel count times sx sy sz times 2.1 ug per mm3. Tolerance three percent."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["euv", "pellicle", "carbon", "contamination", "mass", "fluorescence", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["euv", "pellicle", "carbon-mass", "contamination", "x-ray-fluorescence", "intensity-conservation", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0


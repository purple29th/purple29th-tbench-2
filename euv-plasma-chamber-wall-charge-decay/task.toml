schema_version = "1.1"

[task]
name = "codimango/euv-plasma-chamber-wall-charge-decay"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write from scratch Python script that parses custom EUVC binary with residual wall charge trace from EUV plasma chamber cleaning and counts residual charge via conserved total current to get true wall decay charge in microcoulombs despite RF low pass smear and thermal baseline drift and shutter vibration blips."

authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["euv", "plasma", "wallcharge", "decay", "residualcharge", "binaryparsing", "fromscratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"

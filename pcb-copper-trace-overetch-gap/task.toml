schema_version = "1.1"

[task]
name = "codimango/pcb-copper-trace-overetch-gap"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from scratch Python script that parses a custom X-ray overetch wedge clearance volume OVEG and reports gap volume in mm3. Copper overetch foot clearance has triangular wedge shape, X-ray point spread smears signal, thresholding fails, correct method is attenuation conservation with wedge shape filtering."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["pcb", "copper", "overetch", "wedge", "clearance", "xray", "microct", "binaryparsing", "fromscratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["pcb", "copper-trace", "overetch", "wedge-clearance", "gap-volume", "microct", "pcb-manufacturing", "attenuation-conservation", "from-scratch", "binary-parsing", "oveg"]
expert_time_estimate_min = 65.0
junior_time_estimate_min = 210.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]

description="Android mobile config exposure imbalance: parse custom MCFG binary with signed exposure deltas and dependencies where abs(value) < threshold are free riders not counted and their own dependencies ignored, changing the closure graph itself. Find max total exposure per transitive dependency rules, then minimal counted size among optimal rollouts excluding free riders and zero gain padding, ignoring dangling deps, handling up to 2000 node chains that break recursion."

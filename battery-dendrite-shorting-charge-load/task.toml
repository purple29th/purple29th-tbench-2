schema_version = "1.1"

[task]
name = "codimango/battery-dendrite-shorting-charge-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script that parses a custom X-ray fluorescence volume (.ldch) of lithium dendrites in battery separator and reports total trapped charge in mC. Fluorescence blur spreads signal, thresholding fails 80-130% over or 30-50% under, must use intensity conservation plus shape discrimination to exclude round plating artefacts and far dust specks. Graded at 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["battery", "lithium", "dendrite", "short", "charge", "x-ray", "fluorescence", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["battery", "lithium-dendrite", "separator", "charge-load", "x-ray-fluorescence", "intensity-conservation", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

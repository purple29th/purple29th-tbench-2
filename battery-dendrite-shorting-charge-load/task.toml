schema_version = "1.1"

[task]
name = "codimango/battery-dendrite-shorting-charge-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Pouch cell teardown: parse custom LDCH fluorescence cube of lithium needles piercing polyethylene separator and compute locked charge in mC. Needle metal glows bright but scintillator diffusion smears it. Simple level selection balloons volume or loses tips. Correct via background median, 26-connectivity branching needle isolation using aspect filter longest>=8 and >1.6x shortest to drop round plating islands and far dust, smoothed 3x3x3 top-eight core intensity, shell expansion to noise floor, then volume via sx sy sz times 2.8 mC per mm3. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["battery", "lithium", "dendrite", "short", "charge", "x-ray", "fluorescence", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["battery", "lithium-dendrite", "separator", "charge-load", "x-ray-fluorescence", "intensity-conservation", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0

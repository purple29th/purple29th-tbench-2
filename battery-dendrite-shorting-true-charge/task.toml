schema_version = "1.1"

[task]
name = "codimango/battery-dendrite-shorting-true-charge"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Pouch cell teardown: parse custom LDCH fluorescence cube of lithium needles piercing polyethylene separator and compute locked charge in mC via energy-conservation volume recovery from blurred fluorescence. Must discriminate branching needles from round islands/dust and recover true volume within 3%."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["battery", "lithium", "dendrite", "short", "charge", "x-ray", "fluorescence", "binary-parsing", "from-scratch"]


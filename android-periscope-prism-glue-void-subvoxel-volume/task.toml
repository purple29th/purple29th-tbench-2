schema_version = "1.1"

[task]
name = "codimango/android-periscope-prism-glue-void-subvoxel-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for a custom periscope camera prism glue bond inspection volume (.apcv, magic APCV) in Android flagship periscope telephoto module. Prism-to-lens barrel UV glue entraps air bubbles; 160kV micro-focus X-ray plus scintillator spread creates normalized anisotropic blur that conserves total counts but inflates apparent void. Task asks for true sealed glue void volume in mm3. Bright voxel counting fails ~2x over or 0.5x under. Solution requires robust background median/MAD, largest-mass 26-connected component to drop far dust specks, filtered top-K plateau, adaptive halo growth to noise floor. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["android", "periscope", "prism", "glue-void", "micro-CT", "subvoxel", "energy-conservation", "from-scratch"]


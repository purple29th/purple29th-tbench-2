schema_version = "1.1"

[task]
name = "codimango/sonar-vent-plume-subvoxel-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script (no array or imaging libraries) that parses a custom multibeam sonar volume of a hydrothermal vent plume (binary .svol) and reports true physical plume volume in mm^3. Sonar beam pattern plus water column scattering spreads acoustic energy beyond true plume, so bright voxel counting is unstable across bubble density, seawater background, and anisotropic pitch. Graded on hidden scans at 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["sonar", "hydrothermal", "vent", "plume", "ocean", "bubble", "acoustic", "multibeam", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["sonar", "hydrothermal-vent", "plume-volume", "ocean-acoustics", "bubble-plume", "multibeam-sonar", "from-scratch", "binary-parsing", "seafloor-mapping"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

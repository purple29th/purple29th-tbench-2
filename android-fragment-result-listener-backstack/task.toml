schema_version = "1.1"

[task]
name = "codimango/android-fragment-result-listener-backstack"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Fix a mini Android FragmentManager with Fragment Result API: setResultListener, clearResultListener, setResult. Results must be queued when no listener and delivered when listener appears, survive ROTATE if fragment was backstacked, cleared on REMOVE, restored on POP including named POP using last occurrence. Includes ADD, REPLACE, REMOVE, ADD_TO_BACK_STACK, COMMIT, POP, ROTATE, QUERY. Build and contract tests must pass."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["android", "fragment", "result-listener", "backstack", "kotlin"]


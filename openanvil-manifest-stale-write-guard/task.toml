schema_version = "1.1"

[task]
name = "codimango/openanvil-manifest-stale-write-guard-purple29th"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Fix OpenAnvil S3 manifest stale write guard. S3 manifests with generation token get overwritten by stale heartbeats after terminal state. Requires generation counter + heartbeat recency check + terminal guard, inspired by android-recycler-staleness pattern. Genuine OpenAnvil provisioner bug."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["openanvil", "manifest", "s3", "stale-write", "generation-token", "recycler-staleness", "provisioner"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "software-engineering"

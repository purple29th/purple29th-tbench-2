schema_version = "1.1"

[task]
name = "codimango/faraday-cup-ion-dose-residual-charge"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for a custom Faraday cup current trace (.fcrc, magic FCRC) from high-current ion implant dose metrology in Dresden fab. Samples are int16 deci-mA with varying data_offset, interval, gain. Traces contain drifting baseline, main flat-top implant pulse smeared by electrometer low-pass into wide tails, shallow outgassing hump that is long but low charge, and far turbo pump spikes. Task asks for main pulse residual charge in microcoulombs. Simple thresholding overcounts 60-90% or undercounts 30-55% across recipes. Physics is charge conserving despite blur, so precise integration that isolates main pulse from artifacts is needed. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["faraday-cup", "ion-implant", "dose", "residual-charge", "binary-parsing", "from-scratch", "charge-conservation"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "data_analysis"
reward_type = "binary"
tags = ["faraday-cup", "ion-implant", "dose", "residual-charge", "binary-parsing", "from-scratch", "charge-conservation", "mass-clustering"]
expert_time_estimate_min = 65.0
junior_time_estimate_min = 210.0


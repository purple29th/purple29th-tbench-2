schema_version = "1.1"

[task]
name = "codimango/diecast-aluminum-pore-subvoxel-void"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for a custom industrial CT volume (.adpv, magic ADPV) of hydrogen gas porosity in high-pressure die-cast aluminum automotive housings. 225 kV cone-beam CT focal spot plus scintillator spread creates a normalized anisotropic blur that conserves total counts but inflates apparent size. Task asks for true sealed pore volume in mm3. Bright voxel counting fails by ~2x over or ~0.5x under across batches. Solution requires robust background median/MAD noise, largest-mass 26-connected component to remove far micropores, filtered top-K plateau estimation, and adaptive halo growth to noise floor before converting energy to volume using anisotropic voxel pitch from header. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["aluminum-diecast", "HPDC", "hydrogen-porosity", "industrial-CT", "cone-beam", "gas-pore", "subvoxel", "energy-conservation", "from-scratch", "binary-parsing"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["aluminum-diecast", "HPDC", "hydrogen-porosity", "industrial-CT", "cone-beam", "gas-pore", "subvoxel", "energy-conservation", "from-scratch", "binary-parsing", "quality-control"]

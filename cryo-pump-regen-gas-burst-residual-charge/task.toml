schema_version = "1.1"

[task]
name = "codimango/cryo-pump-regen-gas-burst-residual-charge"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write from scratch Python script that parses custom CRGB binary with residual pressure burst trace from cryo pump regen and counts residual gas charge via conserved total mass to get true regen burst charge in microcoulombs despite cold head low pass smear and thermal baseline drift and valve vibration blips."

authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["cryo", "pump", "regen", "gasburst", "residualcharge", "binaryparsing", "fromscratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

schema_version = "1.1"

[task]
name = "codimango/pcb-trace-capacitance-burden"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "PCB trace capacitance burden: high-speed differential pair over FR4 has tiny voids in prepreg that raise capacitance. Custom CAPV volume magic CAPV holds fluorescence where resin is missing but smear spreads. Need total added capacitance in pF as volume 0.92 pF per mm3 times gain trim from header. Only elongated voids along trace count vs round lamination bubbles to ignore plus far dust. 3 percent tolerance, data offset varied."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["pcb", "capacitance", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"

schema_version = "1.1"

[task]
name = "codimango/solar-wafer-microcrack-true-area"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for a custom electroluminescence wafer scan (.elcr, magic ELCR) of microcracks in monocrystalline PV wafers. Carrier diffusion plus lens PSF creates a normalized anisotropic blur (sig_x != sig_y in some lots) that conserves total dark signal but inflates apparent crack area by ~2x. Pixel pitch is anisotropic (sx != sy e.g. 0.10x0.14 mm). Task asks for true electrically dead area in mm2. Bright-counting fails 80-130% over or 30-50% under across batches due to varying gain and diffusion width. Simple largest 4-sigma component without halo underestimates 5-12% on thin-branch low-amp aniso cases (up to 15%). Solution needs robust background median/MAD, largest-mass 8-connected component to discard dust specks, 3x3 filtered top-K plateau, and adaptive halo growth to noise floor before converting integrated energy to area using anisotropic pixel pitch sx*sy. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["pv-wafer", "microcrack", "electroluminescence", "carrier-diffusion", "true-area", "from-scratch", "binary-parsing", "intensity-conservation"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

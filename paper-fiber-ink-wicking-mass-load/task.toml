schema_version = "1.1"

[task]
name = "codimango/paper-fiber-ink-wicking-mass-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Paper fiber ink wicking mass: quality control for coated paper where ink bleeds along fibers. Custom INKW map magic INKW holds fluorescence where ink sits but capillary bleed smears. Need total ink mass in mg as area 0.85 mg per mm2 times gain from header. Only main irregular ink pool counts vs round water droplets to ignore plus far dust. 3 percent tolerance, data offset varied."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["paper", "ink-wicking", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

schema_version = "1.1"

[task]
name = "codimango/paper-fiber-ink-wicking-mass-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Mill QC for 120gsm photo rag inkjet paper with calendered cellulose base and kaolin clay blade coating. We print a black dye patch, capillary wicking along fiber axis makes a ragged feathered blot whose fiber direction span correlates with Cobb sizing and sheet caliper. A UV fluorescence microscope writes a custom 2D container with fourcc INKW, pixel pitch sx sy, variable payload start, and a post coat calibration multiplier at file offset forty that scales mm result and is non unity for hidden cases like offset ninety six. Evaluation asks for total wicking span in mm computed as recovered pooled area over zero point four mm fiber repeat times multiplier, ignoring circular condensation beads and far corner window dust, summing two distant feathered blots when present, tolerance three percent."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["paper", "ink-wicking", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"

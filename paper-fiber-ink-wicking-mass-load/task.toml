schema_version = "1.1"

[task]
name = "codimango/paper-fiber-ink-wicking-mass-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Coated paper at 120gsm for inkjet photo: cellulose fibers calendered and kaolin coated, dye wicks along fiber creating ragged blot. Scanner writes own binary inkw tag INKW with gain trim at forty that must be read. Total feathering span mm equals recovered area divided by fiber width zero point four times gain. Round water droplets and corner dust must be ignored, two irregular pools far apart must be summed, data offset varied thirty two to one twenty eight, three percent."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["paper", "ink-wicking", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "data_analysis"
reward_type = "binary"
tags = ["paper", "ink-wicking-mass", "binary-parsing", "from-scratch", "intensity-conservation"]
expert_time_estimate_min = 50.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

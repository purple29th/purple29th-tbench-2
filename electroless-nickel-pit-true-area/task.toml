schema_version = "1.1"

[task]
name = "codimango/electroless-nickel-pit-true-area"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for custom white light interferometer map (.enpp, magic ENPP) of hydrogen bubble pits in electroless nickel plating. Lens PSF plus stage vibration creates normalized blur conserving total counts but inflating apparent pit area. Task asks true pit area mm2. Threshold counting fails ~2x over or ~0.5x under due to halo and thin undercut lips. Solution needs robust background median/MAD, largest-mass 8-connected component to remove far dust, filtered top-K plateau, adaptive halo growth to noise floor before converting energy to area using anisotropic pixel pitch from header. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["electroless-nickel", "plating-pit", "hydrogen-bubble", "interferometer", "WLI", "true-area", "energy-conservation", "from-scratch", "binary-parsing"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["electroless-nickel", "plating-pit", "hydrogen-bubble", "interferometer", "WLI", "true-area", "energy-conservation", "from-scratch", "binary-parsing", "quality-control"]
expert_time_estimate_min = 70.0

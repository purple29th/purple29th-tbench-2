schema_version = "1.1"

[task]
name = "codimango/pvd-magnetron-arc-residual-charge"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch parser for custom magnetron sputter arc trace (.pmar, magic PMAR) from PVD chamber. Samples int16 deci-mA with varying data_offset, interval, gain and sinusoidal RF interference plus linear drift. Traces contain main arc discharge smeared by electrometer low-pass, two shallow wide humps (target poisoning and anodic afterglow) each long but low charge, and far micro-spikes from shutter vibration. Simple threshold fails 70-100% over or 35-60% under. Charge conserved despite blur, requires unbiased baseline and isolation of main arc from dual humps and spikes. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["pvd", "magnetron", "sputter", "arc", "residual-charge", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"

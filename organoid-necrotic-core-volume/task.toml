schema_version = "1.1"

[task]
name = "codimango/organoid-necrotic-core-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script (no array/imaging/graph libraries) that parses a custom light-sheet microscopy volume of a cortical organoid necrotic core (custom binary .oncr) and reports its physical necrotic volume in cubic micrometers. Tissue scattering plus light-sheet PSF spreads PI fluorescence, so thresholding overcounts halo or undercounts thin necrotic fingers. Correct method is fluorescence conservation: integrate background-subtracted intensity over isolated core and normalize by saturated plateau. Graded on held-out scans at 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["organoid", "necrotic", "cortical", "light-sheet", "fluorescence", "propidium", "hypoxia", "scattering", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["organoid", "necrotic-core", "cortical-organoid", "light-sheet", "fluorescence", "pi-staining", "tissue-scattering", "psf", "partial-volume", "fluorescence-conservation", "from-scratch", "binary-parsing", "hypoxia"]
expert_time_estimate_min = 65.0
junior_time_estimate_min = 210.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0


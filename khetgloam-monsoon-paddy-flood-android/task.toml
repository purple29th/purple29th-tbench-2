schema_version = "1.1"

[task]
name = "codimango/khetgloam-monsoon-paddy-flood-android"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Reusable Android library (AAR) for monsoon paddy terrace flood evacuation, built with raw Vulkan compute only. I grew up in a Khet paddy village in Kerala where monsoon overtops bunds and drowns terraces; I model per-cell flood risk for farmers. IMPLICIT backward-Euler storm-pulse diffusion solved on GPU each step by Jacobi iteration of (I - ALPHA*L) eta = eta_prev to convergence (inlets pinned N_INJECT steps then released), peak-momentum time-step argmax of spatial-mean depth*speed, Beffa tertile flood intensity FI = depth*max(1,speed), three-band depth-weighted Dijkstra evacuation difficulty with WADE_LOW/HIGH, and risk = clamp(FI_level + difficulty -1,1,5). Verified by driving same raw-Vulkan native lib across JNI on host lavapipe + AAR packaging arm64 raw-Vulkan .so. Human story, from-scratch, no Kompute."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["vulkan", "compute-shader", "android", "aar", "ndk", "jni", "gpgpu", "paddy", "monsoon", "flood-evacuation", "kerala", "khet"]


schema_version = "1.1"

[task]
name = "codimango/ceramic-sinter-pore-subvoxel-void"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script (no array/imaging/graph libraries) that parses a custom micro-CT ceramic pore volume (custom binary .cspv) and reports its physical pore volume in mm^3. X-ray focal spot plus scattering smears pores, so thresholding overcounts halo by 80-130% or undercounts thin cracks by 30-50%. Correct method is intensity conservation: integrate background-subtracted intensity over isolated pore+halo and normalize by concentrated plateau. Graded on held-out scans at 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["ceramic", "sintering", "porosity", "micro-CT", "X-ray", "pore-volume", "subvoxel", "intensity-conservation", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["ceramic", "sintering", "porosity", "micro-CT", "pore-volume", "X-ray-scatter", "subvoxel", "intensity-conservation", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true

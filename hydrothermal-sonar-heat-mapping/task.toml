schema_version = "1.1"

[task]
name = "codimango/hydrothermal-sonar-heat-mapping"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Seafloor sonar mapping of black smoker heat plumes. Reads custom 3D .svol volume and returns true plume volume mm3. Graded at 5% on hidden."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["seafloor", "sonar", "black-smoker", "heat", "plume", "ocean", "mapping", "binary", "volume"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["seafloor", "black-smoker", "sonar-mapping", "heat-plume", "ocean-robotics", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

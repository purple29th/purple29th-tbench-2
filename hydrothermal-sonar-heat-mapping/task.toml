schema_version = "1.1"

[task]
name = "codimango/hydrothermal-sonar-heat-mapping"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from-scratch Python script (no array or imaging libraries) that parses a custom deep sea sonar heat map (binary .svol) containing one hydrothermal vent plume and reports its true physical volume in mm^3. Nearby fish echoes and beam side lobe scatter make bright voxel counting unreliable. Graded at 5% tolerance on hidden scans."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["sonar", "hydrothermal", "vent", "ocean", "acoustic", "plume", "heat", "seafloor", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["ocean-mapping", "hydrothermal-vent", "sonar-heat", "acoustic-plume", "seafloor", "heat-flux", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

schema_version = "1.1"

[task]
name = "codimango/sintered-silver-die-attach-void-subvoxel-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "SiC power module line in Penang: silver sinter die attach between MOSFET and DBC copper. Henkel LOCTITE ABLESTIK sinter paste leaves isolated outgassing bubbles during pressure sintering that raise Rth-jc and cause power cycling hot spots. Phoenix nano-focus X-ray CT at 160kV images attach layer but Ag and Cu scatter plus scintillator bloom spreads bubble signal into wide halos. Custom volume format .ssdv (SSDV) holds inverted bright bubbles on silver matrix. Need true bubble volume mm3, not halo size. Thresholding fails because halo doubles apparent volume or thin vent legs cut to half. Must do median background from lower half, MAD noise, keep biggest integrated bright mass with 26-connectivity to drop organic residue specks, estimate plateau via 3x3x3 filtered top-K mean, grow halo to noise floor without bridging far specks, then volume equals energy over plateau times sx times sy times sz per file. 3 percent tolerance, stdlib only."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["silver-sinter", "DBC", "SiC-MOSFET", "Rth-jc", "Henkel", "ABLESTIK", "outgassing-bubble", "Phoenix-CT", "true-volume", "from-scratch"]


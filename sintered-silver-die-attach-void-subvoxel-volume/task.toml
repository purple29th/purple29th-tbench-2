schema_version = "1.1"

[task]
name = "codimango/sintered-silver-die-attach-void-subvoxel-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "From-scratch Python parser for custom nano-CT volume (.ssdv, magic SSDV) of solvent outgassing voids in sintered silver die attach for SiC power modules. 160 kV nano-focus tube focal spot plus scintillator spread plus scatter in Ag/Cu creates normalized anisotropic blur conserving total counts but inflating apparent void. Task asks for true sealed void volume mm3. Threshold counting fails ~2x over or ~0.5x under across lots due to halo and thin vent channels. Solution needs robust background median/MAD, largest-mass 26-connected component to remove far organic inclusions, filtered top-K plateau, and adaptive halo growth to noise floor before converting energy to volume using anisotropic voxel pitch from header. 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["sintered-silver", "die-attach", "SiC", "power-module", "outgassing", "industrial-CT", "nano-focus", "subvoxel", "energy-conservation", "from-scratch", "binary-parsing"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

schema_version = "1.1"

[task]
name = "codimango/euv-pellicle-carbon-mass-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "EUV pellicle carbon contamination: parse custom EPCM fluorescence cube of carbon soot on freestanding pellicle and compute total carbon mass in ug. Soot glows bright but diffusion smears it, threshold fails 80-130% over or 30-50% under, needs energy conservation plus shape filter to drop round airborne particles and far dust specks, 3% tolerance."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["euv", "pellicle", "carbon", "contamination", "mass", "fluorescence", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["euv", "pellicle", "carbon-mass", "contamination", "x-ray-fluorescence", "intensity-conservation", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 60.0
junior_time_estimate_min = 200.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

schema_version = "1.1"

[task]
name = "codimango/billet-hydrogen-pore-pressure-load"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Billet hydrogen pore pressure: hydrogen gas diffused into continuously cast aluminum billet forms round sealed pores with pressurized gas. Custom HPPR volume magic HPPR holds fluorescence where hydrogen glows but smear spreads. Need internal gas pressure in kPa as nRT over recovered true volume. One to three sub mm dust specks plus elongated MnS stringers to ignore, only round pores count. Pressure equals constant 780 over volume, volume via conservation 3% tolerance, data offset varied."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["billet", "hydrogen", "pore-pressure", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"

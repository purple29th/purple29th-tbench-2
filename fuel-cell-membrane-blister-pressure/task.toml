schema_version = "1.1"

[task]
name = "codimango/fuel-cell-membrane-blister-pressure"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Fuel cell test stand logs pressure after blister pop. File is FMBP binary with Nafion membrane blister pressure burst smeared by amplifier. Need true burst pressure in kPa for main pop using robust background and mass based clustering. Distinct story from chuck charge and PCB void."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["fuelcell", "membrane", "blister", "pressure", "binaryparsing", "fromscratch", "membranefailure"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

schema_version = "1.1"

[task]
name = "codimango/mems-microphone-membrane-perforation-leak"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write from scratch Python script that parses custom X ray perforation leak volume of MEMS microphone membrane and reports leak volume in mm3. Membrane perforation glows in X ray but blur spreads signal so threshold fails. Correct method is intensity conservation plus elongated shape filtering."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["mems", "microphone", "membrane", "perforation", "leak", "acoustic", "xray", "binaryparsing", "fromscratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"

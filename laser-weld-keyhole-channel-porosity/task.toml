schema_version = "1.1"

[task]
name = "codimango/laser-weld-keyhole-channel-porosity"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from scratch Python script that parses a custom X ray volume of laser weldment and reports true keyhole channel porosity volume in mm3. Keyhole channels glow bright but blur spreads signal so thresholding fails. Correct method is intensity conservation plus shape filter."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["laser", "weld", "keyhole", "channel", "porosity", "xray", "binaryparsing", "fromscratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["laser-weld", "keyhole", "channel-porosity", "xray", "weld-inspection", "intensity-conservation", "from-scratch", "binary-parsing", "shape-filter"]
expert_time_estimate_min = 65.0
junior_time_estimate_min = 210.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []


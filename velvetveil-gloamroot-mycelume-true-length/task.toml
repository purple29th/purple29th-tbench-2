schema_version = "1.1"

[task]
name = "codimango/velvetveil-gloamroot-mycelume-true-length"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Mycology field lab grading of bioluminescent Armillaria rhizomorphs (foxfire) in forest duff. Low-light sCMOS maps of photon veil are smeared by fog scattering and lens PSF; total glow length requires recovery of halo via energy conservation. Custom 2D container MYCR with magic, variable payload_start, pixel pitch sx sy, and post veil gain multiplier at offset 40 that scales mm. Task asks total illuminated cord length mm via pooled area / 0.4 mm repeat * gain, ignoring round bacterial colonies and far corner soil dust, summing two distant cords when present. 3% tolerance, stdlib only."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["mycelium", "rhizomorph", "bioluminescence", "foxfire", "binary-parsing", "from-scratch", "forest-ecology", "photon-veil"]


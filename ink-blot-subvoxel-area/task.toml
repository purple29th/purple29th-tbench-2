schema_version = "1.1"

[task]
name = "codimango/ink-blot-subvoxel-area"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Create a pure Python paper tester that reads a filter paper ink blot scan (.inkb) holding one ink drop and reports its true fiber saturated area in mm2. Wicking plus lens spread makes dark pixel totals unreliable. Graded at 3% on hidden scans."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["ink", "capillary", "blot", "paper", "porous", "wiking", "area", "diffusion", "binary-parsing", "from-scratch"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["ink-blot", "capillary-wicking", "paper-porous", "blot-area", "diffusion-psf", "partial-area", "porous-wicking", "from-scratch", "binary-parsing", "filter-paper"]
expert_time_estimate_min = 50.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]

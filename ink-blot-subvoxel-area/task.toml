schema_version = "1.1"

[task]
name = "codimango/ink-blot-subvoxel-area"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Paper absorbency test via ink wick on filter sheet. Reads custom 2D .inkb scan and returns true wet area mm2. Graded at 3% on hidden scans."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["paper", "ink", "filter", "absorbency", "blot", "qc", "wiking", "binary", "area"]

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
difficulty = "hard"
category = "data-science"
category_subdomain = "multimedia_and_signal_processing"
category_usecase = "parsing_lexing"
reward_type = "binary"
tags = ["paper-qc", "ink-wiking", "filter-sheet", "absorbency", "blot-area", "from-scratch", "binary-parsing"]
expert_time_estimate_min = 50.0
junior_time_estimate_min = 180.0

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 15360
gpus = 0

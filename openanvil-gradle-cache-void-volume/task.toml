schema_version = "1.1"

[task]
name = "codimango/openanvil-gradle-cache-void-volume"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a from scratch Python script that parses custom OpenAnvil Gradle build void volume ANVL and reports void volume in mm3. Android grader Gradle cache gap is elongated along build X, X-ray point spread smears signal, thresholding fails, correct method is attenuation conservation with elongated vs compact shape filtering. OpenAnvil related."
authors = [{ name = "Tosin Daniel Jimoh", email = "purple29th@meta.com" }]
keywords = ["openanvil", "android", "gradle", "cache", "void", "xray", "microct", "binaryparsing", "fromscratch"]


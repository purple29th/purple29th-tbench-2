schema_version = "1.1"

[task]
name = "codimango/seismic-p-wave-onset-pick"
description = "Seismic P wave onset picking from custom SEIS binary with variable dt and offset. Trace has P arrival plus larger S arrival plus noise spikes. Need robust STA LTA from scratch without numpy scipy obspy."
authors = [{name="Tosin Daniel Jimoh", email="purple29th@meta.com"}]
keywords = ["seismic", "signal-processing", "binary-parsing", "from-scratch", "sta-lta", "onset-picking"]
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"

[metadata]
author_name = "Tosin Daniel Jimoh"
author_email = "purple29th@meta.com"
